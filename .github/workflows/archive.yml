name: Archive to Wayback Machine

# Submits the canonical URLs of this repository to the Internet Archive
# Wayback Machine on every push to main and on a daily schedule.
# Independent third-party timestamps are part of the prior-use record.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Submit canonical URLs to Wayback Machine
        run: |
          set -u
          urls=(
            "https://github.com/CIRISAI/prior-use"
            "https://github.com/CIRISAI/prior-use/blob/main/README.md"
            "https://github.com/CIRISAI/prior-use/blob/main/prior-use.json"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/README.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/prior-use.json"
            "https://github.com/CIRISAI/prior-use/tree/main/docs"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/accord.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/cewpos.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/alignment-manifold.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/coherence-ratchet.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/conscience.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/constitution.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/covenant.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/federation.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/h3ere.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/holon-draw.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/holon.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/isa.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/kernel.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/m1-adaptive-coherence.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/ontology.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/pdma.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/ratchet.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/reality-compiler.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/stewardship-tier.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/wbd.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/client.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/csd.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/grace.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/spec-language.md"
            "https://raw.githubusercontent.com/CIRISAI/prior-use/main/docs/wise-authority.md"
          )
          for url in "${urls[@]}"; do
            echo "Submitting: $url"
            curl -sS -o /dev/null -w "  status: %{http_code}\n" \
                 -X GET "https://web.archive.org/save/$url" \
              || echo "  (submission failed; continuing)"
            sleep 6   # avoid rate-limiting
          done
